<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提瓦特放置 - 塔防</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 关卡选择 ===== -->
<div id="stage-select">
    <div class="stage-title">提瓦特放置</div>
    <div class="stage-subtitle">选择地图，进入战斗</div>
    <div id="map-grid" class="map-grid"></div>
</div>

<!-- ===== 战斗面板 ===== -->
<div id="battle-panel">
    <div id="battle-top">
        <div class="battle-info">
            <span><span class="label">💰</span><span class="value" id="info-gold">350</span></span>
            <span><span class="label">❤️</span><span class="value" id="info-lives">20/20</span></span>
            <span><span class="label">🌊 波次</span><span class="value" id="info-wave">0/3</span></span>
            <span><span class="label">👾 击杀</span><span class="value" id="info-kills">0</span></span>
        </div>
        <div style="display:flex;gap:10px;">
            <button id="btn-start-wave">▶ 开始出怪</button>
            <button id="btn-return">↩ 返回</button>
        </div>
    </div>
    <div id="canvas-wrapper">
        <canvas id="td-canvas"></canvas>
    </div>
</div>

<!-- ===== 弹出菜单 ===== -->
<div id="popup-menu">
    <div class="popup-title">格子 <span id="popup-grid">(0,0)</span></div>
</div>

<!-- ===== JS ===== -->
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
